<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hermanos Del Perfume — Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#090909;color:#eee;font-family:Arial,Tahoma,sans-serif}.wrap{max-width:1100px;margin:auto;padding:14px}.box,.card{background:#151515;border:1px solid #292929;border-radius:16px;padding:14px;margin:10px 0}h1,h2{color:#e1c17a}input,select{width:100%;box-sizing:border-box;padding:11px;margin:5px 0;background:#0d0d0d;border:1px solid #333;border-radius:9px;color:#fff}button{border:0;border-radius:9px;padding:10px 13px;background:#d6b36a;color:#111;font-weight:800;margin:3px;cursor:pointer}.dark{background:#292929;color:#fff}.danger{background:#7b3030;color:#fff}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.admin-section{display:none}.admin-section.active{display:block}.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}.menu button{margin:0;background:#171717;color:#ddd;border:1px solid #333}.menu button.active{background:#d6b36a;color:#111;border-color:#d6b36a}.section-card{min-height:180px}.order-card{transition:.15s}.order-card:hover{border-color:#d6b36a}@media(max-width:650px){.menu{grid-template-columns:repeat(2,1fr)}}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.muted{color:#999}.thumb{height:150px;background:#211d16;border-radius:11px;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img{max-width:100%;max-height:100%;object-fit:contain}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#292929;margin:2px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#101010;border:1px solid #292929;border-radius:12px;padding:12px}.stat b{display:block;font-size:24px;color:#e1c17a}@media(max-width:650px){.row,.stats{grid-template-columns:1fr}.wrap{padding:9px}}</style></head><body><div class="wrap"><h1>Hermanos Del Perfume — لوحة الإدارة</h1><div id="login" class="box"><h2>🔐 دخول الإدارة</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="كلمة السر"><button onclick="login()">دخول</button><div id="msg" class="muted"></div></div><div id="app" class="hidden"><div class="box"><b id="who"></b> <button class="dark" onclick="logout()">خروج</button></div><div class="stats"><div class="stat">الطلبات<b id="stOrders">0</b></div><div class="stat">الجديدة<b id="stNew">0</b></div><div class="stat">العطور<b id="stProducts">0</b></div><div class="stat">Stock ناقص<b id="stLow">0</b></div><div class="menu"><button id="mOrders" class="active" onclick="showSection('orders')">📦 الطلبات</button><button id="mProducts" onclick="showSection('products')">🧴 العطور</button><button id="mDelivery" onclick="showSection('delivery')">🚚 أسعار التوصيل</button><button id="mBrands" onclick="showSection('brands')">🏷️ الماركات</button></div></div><div id="secProducts" class="admin-section active"><div class="box"><h2>🧴 إضافة / تعديل عطر</h2><input id="pid" type="hidden"><input id="name" placeholder="اسم العطر"><select id="brand"><option value="">اختر الماركة</option></select><select id="gender"><option>للرجال</option><option>للنساء</option><option>للجنسين</option></select><h3>الديكانت</h3><div class="row"><input id="p5" type="number" min="0" placeholder="سعر 5ml"><input id="p10" type="number" min="0" placeholder="سعر 10ml"><input id="p20" type="number" min="0" placeholder="سعر 20ml"><span></span></div><div class="row"><input id="s5" type="number" min="0" placeholder="Stock 5ml"><input id="s10" type="number" min="0" placeholder="Stock 10ml"><input id="s20" type="number" min="0" placeholder="Stock 20ml"><span></span></div><h3>🧴 العبوة الأصلية الكاملة</h3><div class="row"><input id="fullSize" placeholder="مثال: 100ml"><input id="pFull" type="number" min="0" placeholder="سعر العبوة الكاملة"><input id="sFull" type="number" min="0" placeholder="Stock العبوات"><span></span></div><input id="image" type="file" accept="image/*"><label><input id="active" type="checkbox" checked style="width:auto"> المنتج ظاهر للزبائن</label><br><button onclick="saveProduct()">💾 حفظ</button><button class="dark" onclick="resetForm()">إلغاء</button><div id="saveMsg" class="muted"></div></div></div><div id="secBrands" class="admin-section"><div class="box"><h2>🏷️ الماركات</h2><div class="row"><input id="brandName" placeholder="اسم الماركة"><button onclick="saveBrand()">إضافة</button><span></span><span></span></div><div id="brandsList" class="grid"></div></div></div><div id="secStock" class="admin-section"><div class="box"><h2>📦 العطور والستوك</h2><button onclick="loadAll()">🔄 تحديث</button><div id="productsList" class="grid"></div></div></div></div><div id="secDelivery" class="admin-section"><div class="box"><h2>🚚 أسعار التوصيل حسب الولاية</h2><div id="deliveryList" class="grid"></div></div></div></div><div id="secOrders" class="admin-section"><div class="box"><h2>📦 الطلبات</h2><div id="ordersList"></div></div></div></div></div></div><script>
const cfg={supabaseUrl:'https://esycfxumzvxnnpzopizf.supabase.co',supabaseAnonKey:'sb_publishable_OXbEGkFMYAFUxNJIUCfhww_R3ZHw88p'};const sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function login(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return $('msg').textContent='دخل الإيميل وكلمة السر.';$('msg').textContent='جاري الدخول...';const {error}=await sb.auth.signInWithPassword({email,password});if(error)return $('msg').textContent='فشل الدخول: '+error.message;const {data,isAdmin,error:ae}=await sb.rpc('is_admin');if(ae||!isAdmin){await sb.auth.signOut();return $('msg').textContent=ae?'تعذر التحقق من Admin: '+ae.message:'الحساب ما عندوش صلاحية Admin.';}await check();}
async function check(){const {data:{session}}=await sb.auth.getSession();if(!session){$('login').classList.remove('hidden');$('app').classList.add('hidden');return;}const {data,error}=await sb.rpc('is_admin');if(error||!data){await sb.auth.signOut();$('msg').textContent='الحساب ما عندوش صلاحية Admin.';return;}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=session.user.email;loadAll();}
async function loadAll(){await Promise.all([loadProducts(),loadBrands(),loadDelivery(),loadOrders(),loadStats()]);}
async function loadStats(){const a=await sb.from('orders').select('id,status'),b=await sb.from('products').select('id,stock_5ml,stock_10ml,stock_20ml,stock_full');$('stOrders').textContent=(a.data||[]).length;$('stNew').textContent=(a.data||[]).filter(x=>x.status==='pending'||x.status==='new').length;$('stProducts').textContent=(b.data||[]).length;$('stLow').textContent=(b.data||[]).filter(x=>[x.stock_5ml,x.stock_10ml,x.stock_20ml,x.stock_full].some(v=>Number(v||0)<=2)).length;}
async function loadBrands(){const {data,error}=await sb.from('brands').select('*').order('name');if(error){$('brandsList').textContent=error.message;return;}$('brand').innerHTML='<option value="">اختر الماركة</option>'+(data||[]).map(b=>`<option value="${esc(b.name)}">${esc(b.name)}</option>`).join('');$('brandsList').innerHTML=(data||[]).map(b=>`<div class="card"><b>${esc(b.name)}</b><button class="danger" onclick="delBrand('${b.id}')">حذف</button></div>`).join('')||'مازال ماكانش ماركات.';}
async function saveBrand(){const name=$('brandName').value.trim();if(!name)return;const {error}=await sb.from('brands').insert({name});if(error)return alert(error.message);$('brandName').value='';loadBrands();}
async function delBrand(id){if(!confirm('تحب تحذف الماركة؟'))return;const {error}=await sb.from('brands').delete().eq('id',id);if(error)alert(error.message);else loadBrands();}
async function saveProduct(){let id=$('pid').value,image_url=null;const f=$('image').files[0];if(f){const path=crypto.randomUUID()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const up=await sb.storage.from('product-images').upload(path,f,{upsert:true});if(up.error)return $('saveMsg').textContent=up.error.message;image_url=sb.storage.from('product-images').getPublicUrl(path).data.publicUrl;}const obj={name:$('name').value.trim(),brand:$('brand').value.trim(),gender:$('gender').value,price_5ml:$('p5').value?Number($('p5').value):null,price_10ml:$('p10').value?Number($('p10').value):null,price_20ml:$('p20').value?Number($('p20').value):null,stock_5ml:Number($('s5').value||0),stock_10ml:Number($('s10').value||0),stock_20ml:Number($('s20').value||0),price_full:$('pFull').value?Number($('pFull').value):null,stock_full:Number($('sFull').value||0),full_bottle_size:$('fullSize').value.trim()||null,active:$('active').checked};if(image_url)obj.image_url=image_url;const r=id?await sb.from('products').update(obj).eq('id',id):await sb.from('products').insert(obj);if(r.error)return $('saveMsg').textContent=r.error.message;$('saveMsg').textContent='تم الحفظ ✅';resetForm();loadAll();}
function edit(p){$('pid').value=p.id;$('name').value=p.name||'';$('brand').value=p.brand||'';$('gender').value=p.gender||'للجنسين';$('p5').value=p.price_5ml??'';$('p10').value=p.price_10ml??'';$('p20').value=p.price_20ml??'';$('s5').value=p.stock_5ml??0;$('s10').value=p.stock_10ml??0;$('s20').value=p.stock_20ml??0;$('pFull').value=p.price_full??'';$('sFull').value=p.stock_full??0;$('fullSize').value=p.full_bottle_size||'';$('active').checked=p.active!==false;scrollTo(0,0);}
function resetForm(){['pid','name','p5','p10','p20','s5','s10','s20','pFull','sFull','fullSize'].forEach(x=>$(x).value='');$('brand').value='';$('image').value='';$('active').checked=true;}
async function loadProducts(){const {data,error}=await sb.from('products').select('*').order('brand').order('name');if(error){$('productsList').textContent=error.message;return;}$('productsList').innerHTML=(data||[]).map(p=>`<div class="card"><div class="thumb">${p.image_url?`<img src="${esc(p.image_url)}">`:'🧴'}</div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.brand||'')} • ${esc(p.gender||'')}</div><p>5ml: ${p.price_5ml??'-'} دج / ${p.stock_5ml??0} — 10ml: ${p.price_10ml??'-'} / ${p.stock_10ml??0} — 20ml: ${p.price_20ml??'-'} / ${p.stock_20ml??0}</p><p>كاملة ${esc(p.full_bottle_size||'')} : ${p.price_full??'-'} دج / ${p.stock_full??0}</p><span class="pill">${p.active===false?'مخفي':'ظاهر'}</span><button onclick='edit(${JSON.stringify(p)})'>✏️ تعديل</button><button class="dark" onclick="toggleActive('${p.id}',${p.active!==false})">${p.active===false?'إظهار':'إخفاء'}</button><button class="danger" onclick="delProduct('${p.id}')">حذف</button></div>`).join('')||'ماكانش عطور.';}
async function toggleActive(id,current){const {error}=await sb.from('products').update({active:!current}).eq('id',id);if(error)alert(error.message);else loadProducts();}async function delProduct(id){if(!confirm('حذف العطر نهائياً؟'))return;const {error}=await sb.from('products').delete().eq('id',id);if(error)alert(error.message);else loadAll();}
async function loadDelivery(){const {data,error}=await sb.from('delivery_settings').select('*').order('code');if(error){$('deliveryList').textContent=error.message;return;}$('deliveryList').innerHTML=(data||[]).map(x=>`<div class="card"><b>${esc(x.code)} — ${esc(x.wilaya)}</b><div class="row"><input id="dh_${x.code}" type="number" min="0" value="${Number(x.domicile_price||0)}"><input id="dp_${x.code}" type="number" min="0" value="${Number(x.pickup_price||0)}"><button onclick="saveDelivery('${x.code}')">حفظ</button><span></span></div></div>`).join('');}async function saveDelivery(code){const h=Number($('dh_'+code).value||0),p=Number($('dp_'+code).value||0);const {error}=await sb.from('delivery_settings').update({domicile_price:h,pickup_price:p,updated_at:new Date().toISOString()}).eq('code',code);if(error)alert(error.message);}
async function loadOrders(){const {data,error}=await sb.from('orders').select('*').order('created_at',{ascending:false});if(error){$('ordersList').textContent=error.message;return;}const ids=[...new Set((data||[]).flatMap(o=>Array.isArray(o.items)?o.items.map(x=>x.product_id).filter(Boolean):[]))];let products=[];if(ids.length){const r=await sb.from('products').select('id,name,brand').in('id',ids);products=r.data||[];}const pm=new Map(products.map(p=>[p.id,p]));$('ordersList').innerHTML=(data||[]).map(o=>{const items=Array.isArray(o.items)?o.items:[];return `<div class="card order-card" id="order_${o.id}" onclick="toggleOrder('${o.id}')" style="cursor:pointer"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h3 style="margin:0 0 6px">#${esc(o.order_number||o.id)}</h3><b>${esc(o.customer_name||'بدون اسم')}</b><div class="muted">${esc(o.phone||'')} • ${esc(o.wilaya||o.wilaya_code||'')} / ${esc(o.commune||'')}</div></div><span class="pill">${esc(o.status||'pending')}</span></div><div class="order-details" id="details_${o.id}" style="display:none;margin-top:12px;border-top:1px solid #333;padding-top:12px"><p><b>👤 معلومات الزبون</b><br>الاسم: ${esc(o.customer_name||'-')}<br>الهاتف: ${esc(o.phone||'-')}<br>الولاية: ${esc(o.wilaya||o.wilaya_code||'-')}<br>البلدية: ${esc(o.commune||'-')}<br>العنوان: ${esc(o.address||'-')}<br>طريقة التوصيل: ${esc(o.delivery_method||'-')}</p><p><b>🧴 العطور المختارة</b><br>${items.map(x=>{const p=pm.get(x.product_id);const n=x.name||x.product_name||(p&&p.name)||'عطر غير معروف';const b=x.brand||(p&&p.brand)||'';return `• <b>${esc(n)}</b>${b?' — '+esc(b):''} — ${esc(x.size==='full'?'العبوة الكاملة':x.size||'')} × ${x.quantity??x.qty??1}`}).join('<br>')||'لا توجد منتجات محفوظة في الطلب'}</p><p>المجموع قبل التوصيل: ${o.total_amount??0} دج<br>التوصيل: ${o.delivery_fee??0} دج<br><b>المجموع النهائي: ${o.grand_total??0} دج</b></p><select onclick="event.stopPropagation()" onchange="updateStatus('${o.id}',this.value)"><option value="pending" ${o.status==='pending'?'selected':''}>جديد</option><option value="confirmed" ${o.status==='confirmed'?'selected':''}>مؤكد</option><option value="preparing" ${o.status==='preparing'?'selected':''}>قيد التحضير</option><option value="shipped" ${o.status==='shipped'?'selected':''}>تم الشحن</option><option value="completed" ${o.status==='completed'?'selected':''}>مكتمل</option><option value="cancelled" ${o.status==='cancelled'?'selected':''}>ملغى</option></select></div></div>`}).join('')||'ماكانش طلبات.';}
function showSection(name){document.querySelectorAll('.admin-section').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.menu button').forEach(x=>x.classList.remove('active'));const map={orders:'secOrders',products:'secProducts',delivery:'secDelivery',brands:'secBrands'};const bmap={orders:'mOrders',products:'mProducts',delivery:'mDelivery',brands:'mBrands'};$(map[name]).classList.add('active');$(bmap[name]).classList.add('active');if(name==='orders')loadOrders();if(name==='delivery')loadDelivery();if(name==='products'){loadProducts();}if(name==='brands')loadBrands();}
function toggleOrder(id){const d=$('details_'+id);if(d)d.style.display=d.style.display==='none'?'block':'none';}
async function updateStatus(id,status){const {error}=await sb.from('orders').update({status}).eq('id',id);if(error)alert(error.message);else loadOrders();}async function logout(){await sb.auth.signOut();check();}check();
</script></body></html>
