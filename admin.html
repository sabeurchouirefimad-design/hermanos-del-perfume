<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HDP Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>body{margin:0;background:#090909;color:#eee;font-family:Arial,Tahoma,sans-serif}.wrap{max-width:900px;margin:auto;padding:25px}.box{background:#151515;border:1px solid #2d2d2d;border-radius:18px;padding:20px;margin:15px 0}h1{color:#e1c17a}input,select{width:100%;padding:13px;margin:7px 0;background:#0e0e0e;border:1px solid #333;border-radius:10px;color:#fff;box-sizing:border-box}button{border:0;border-radius:10px;padding:12px 16px;cursor:pointer;background:#d6b36a;color:#111;font-weight:700;margin:5px 0}.danger{background:#7b3030;color:#fff}.muted{color:#999}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.item{background:#101010;border:1px solid #292929;border-radius:14px;padding:14px}.thumb{height:160px;background:#201d18;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:contain}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}@media(max-width:600px){.row{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><div class="wrap"><h1>Hermanos Del Perfume — لوحة الإدارة</h1><div id="login" class="box"><h2>دخول الإدارة</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="كلمة السر"><button onclick="login()">دخول</button><p class="muted">الحساب يتدار من Supabase Authentication.</p><div id="msg"></div></div><div id="app" class="hidden"><div class="box"><b id="who"></b><button onclick="logout()">خروج</button></div><div class="box"><h2>➕ إضافة / تعديل عطر</h2><input id="id" type="hidden"><input id="name" placeholder="اسم العطر"><input id="brand" placeholder="الماركة"><select id="gender"><option>للرجال</option><option>للنساء</option><option>للجنسين</option></select><div class="row"><input id="p5" type="number" placeholder="سعر 5ml"><input id="p10" type="number" placeholder="سعر 10ml"><input id="p20" type="number" placeholder="سعر 20ml"></div><label>صورة العطر</label><input id="image" type="file" accept="image/*"><button onclick="saveProduct()">حفظ العطر</button><button style="background:#333;color:#fff" onclick="resetForm()">إلغاء التعديل</button><div id="saveMsg"></div></div><div class="box"><h2>🧴 العطور</h2><div id="list" class="grid"></div></div></div></div><script>const cfg=window.HDP_CONFIG||{};const sb=(cfg.supabaseUrl&&cfg.supabaseAnonKey&&!cfg.supabaseUrl.includes('YOUR_'))?supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey):null;const $=id=>document.getElementById(id);function msg(t){$('msg').textContent=t}async function login(){if(!sb)return msg('أولاً حط بيانات Supabase في config.js');const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return msg(error.message);await check()}async function check(){if(!sb)return;const {data:{session}}=await sb.auth.getSession();if(!session){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}const {data:profile,error:profileError}=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(profileError){msg('خطأ في التحقق من صلاحية Admin: '+profileError.message);return}if(!profile||profile.role!=='admin'){msg('هذا الحساب ما عندوش صلاحية Admin. تأكد أن Role في Profiles هو admin.');await sb.auth.signOut();return}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=session.user.email;load()}async function load(){const {data,error}=await sb.from('products').select('*').order('brand').order('name');if(error)return $('list').textContent=error.message;$('list').innerHTML=data.map(p=>`<div class="item"><div class="thumb">${p.image_url?`<img src="${esc(p.image_url)}">`:'🧴'}</div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.brand)} • ${esc(p.gender||'')}</div><p>5ml: ${p.price_5ml??'-'} | 10ml: ${p.price_10ml??'-'} | 20ml: ${p.price_20ml??'-'}</p><button onclick='edit(${JSON.stringify(p)})'>✏️ تعديل</button> <button class="danger" onclick="del('${p.id}')">حذف</button></div>`).join('')}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function edit(p){$('id').value=p.id;$('name').value=p.name;$('brand').value=p.brand;$('gender').value=p.gender||'للجنسين';$('p5').value=p.price_5ml??'';$('p10').value=p.price_10ml??'';$('p20').value=p.price_20ml??'';scrollTo(0,0)}function resetForm(){['id','name','brand','p5','p10','p20'].forEach(x=>$(x).value='');$('image').value=''}async function saveProduct(){if(!sb)return;let id=$('id').value;let image_url=null;const f=$('image').files[0];if(f){const path=`${crypto.randomUUID()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const up=await sb.storage.from('product-images').upload(path,f,{upsert:true});if(up.error)return $('saveMsg').textContent=up.error.message;image_url=sb.storage.from('product-images').getPublicUrl(path).data.publicUrl}const obj={name:$('name').value.trim(),brand:$('brand').value.trim(),gender:$('gender').value,price_5ml:$('p5').value?Number($('p5').value):null,price_10ml:$('p10').value?Number($('p10').value):null,price_20ml:$('p20').value?Number($('p20').value):null};if(image_url)obj.image_url=image_url;let r=id?await sb.from('products').update(obj).eq('id',id):await sb.from('products').insert(obj);if(r.error)return $('saveMsg').textContent=r.error.message;$('saveMsg').textContent='تم الحفظ ✅';resetForm();load()}async function del(id){if(!confirm('تحب تحذف العطر؟'))return;const {error}=await sb.from('products').delete().eq('id',id);if(error)alert(error.message);else load()}async function logout(){await sb.auth.signOut();check()}check()</script></body></html>
